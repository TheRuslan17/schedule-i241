<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>И-24-1 · расписание</title>
  <style>
    /* ——— базовые стили ——— */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f2f5f9;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0.8rem;
    }

    .card {
      max-width: 880px;
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      padding: 1.2rem 1.2rem;
      transition: 0.2s;
    }

    /* шапка */
    .head {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 1rem;
      border-bottom: 1px solid #eef2f6;
      padding-bottom: 0.9rem;
      gap: 0.4rem;
    }

    .head h1 {
      font-weight: 500;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      color: #0b1a2a;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.2rem 0.5rem;
    }

    .head h1 span {
      font-weight: 350;
      color: #4b5d73;
      font-size: 1.1rem;
    }

    /* навигация по дням */
    .day-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.6rem;
      margin-bottom: 1.2rem;
      align-items: center;
    }

    .day-btn {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 60px;
      padding: 0.35rem 1.2rem;
      font-size: 0.85rem;
      font-weight: 450;
      color: #2c3d53;
      cursor: pointer;
      transition: 0.12s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .day-btn:active {
      transform: scale(0.96);
    }

    .day-btn:hover {
      background: #f1f5fa;
      border-color: #c8d2e0;
    }

    .day-btn.active {
      background: #1e2a3a;
      border-color: #1e2a3a;
      color: white;
    }

    .day-label {
      font-size: 0.85rem;
      color: #4d637b;
      font-weight: 400;
    }

    /* ——— скелетон ——— */
    .skeleton {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .skeleton-header {
      display: none;
    }

    .skeleton-row {
      display: grid;
      grid-template-columns: 50px 1fr 1fr;
      gap: 0.3rem 0.6rem;
      padding: 0.6rem 0.8rem;
      border-radius: 14px;
      background: white;
      border: 1px solid #f0f4fa;
      align-items: center;
    }

    .skeleton-shimmer {
      height: 1rem;
      border-radius: 6px;
      background: linear-gradient(90deg, #f0f3f8 25%, #e6ebf2 50%, #f0f3f8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-shimmer.short { width: 40px; }
    .skeleton-shimmer.medium { width: 60px; }
    .skeleton-shimmer.long { width: 100%; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ——— АНИМАЦИЯ ——— */
    .schedule-content {
      animation: slideFadeIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    @keyframes slideFadeIn {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ============================================
       ТАБЛИЦА ДЛЯ ПК (широкие экраны)
    ============================================ */
    .schedule-table {
      display: none;
      flex-direction: column;
      gap: 0.4rem;
    }

    .schedule-table .row-header {
      display: grid;
      grid-template-columns: 50px 90px 60px 1fr 1.1fr 80px 70px;
      gap: 0.3rem 0.6rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #6f7f94;
      padding: 0.4rem 0.6rem 0.6rem 0.6rem;
      border-bottom: 1px solid #eaedf2;
      background: #fafcfe;
      border-radius: 16px;
      font-weight: 500;
    }

    .schedule-table .row-header span:last-child {
      text-align: right;
    }

    .schedule-table .row-item {
      display: grid;
      grid-template-columns: 50px 90px 60px 1fr 1.1fr 80px 70px;
      gap: 0.3rem 0.6rem;
      align-items: center;
      background: white;
      padding: 0.5rem 0.6rem;
      border-radius: 14px;
      border: 1px solid #f0f4fa;
      transition: 0.08s;
      font-size: 0.88rem;
      line-height: 1.3;
    }

    .schedule-table .row-item:hover {
      background: #f8faff;
      border-color: #dce4ef;
    }

    .schedule-table .row-item.current-pair {
      border-color: #4a7aff;
      background: rgba(74, 122, 255, 0.08);
      box-shadow: 0 0 0 2px rgba(74, 122, 255, 0.12);
    }

    .pair-num {
      font-weight: 480;
      color: #142433;
      background: #f0f4fc;
      border-radius: 40px;
      text-align: center;
      padding: 0.1rem 0;
      font-size: 0.8rem;
      width: 40px;
    }

    .pair-time {
      font-size: 0.7rem;
      color: #4d637b;
      text-align: center;
      font-weight: 450;
      white-space: nowrap;
    }

    .subgroup {
      font-size: 0.7rem;
      background: #eef3fa;
      border-radius: 30px;
      text-align: center;
      padding: 0.1rem 0.2rem;
      color: #2e405b;
      font-weight: 450;
      min-width: 30px;
    }

    .subgroup.empty {
      background: transparent;
      color: #a5b7cd;
    }

    .discipline {
      font-weight: 470;
      color: #0a1c2e;
      word-break: break-word;
    }

    .teacher {
      color: #1b3147;
      font-size: 0.85rem;
    }

    .auditorium {
      background: #eef3fa;
      padding: 0.1rem 0.5rem;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #1f364d;
      text-align: center;
      width: fit-content;
      min-width: 50px;
      font-weight: 450;
    }

    .territory {
      font-size: 0.7rem;
      color: #4a637e;
      text-align: right;
      white-space: nowrap;
    }

    /* ============================================
       КАРТОЧКИ ДЛЯ ТЕЛЕФОНА
    ============================================ */
    .schedule-cards {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .schedule-cards .card-item {
      background: white;
      border: 1px solid #f0f4fa;
      border-radius: 16px;
      padding: 0.7rem 0.8rem;
      transition: 0.08s;
    }

    .schedule-cards .card-item.current-pair {
      border-color: #4a7aff;
      background: rgba(74, 122, 255, 0.06);
      box-shadow: 0 0 0 2px rgba(74, 122, 255, 0.1);
    }

    .schedule-cards .card-top {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.3rem;
    }

    .schedule-cards .card-pair {
      font-weight: 600;
      color: #142433;
      background: #f0f4fc;
      border-radius: 40px;
      padding: 0.05rem 0.6rem;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .schedule-cards .card-time {
      font-size: 0.7rem;
      color: #4d637b;
      font-weight: 450;
    }

    .schedule-cards .card-subgroup {
      font-size: 0.65rem;
      background: #eef3fa;
      border-radius: 30px;
      padding: 0.05rem 0.5rem;
      color: #2e405b;
      font-weight: 450;
    }

    .schedule-cards .card-subgroup.empty {
      background: transparent;
      color: #a5b7cd;
    }

    .schedule-cards .card-discipline {
      font-weight: 500;
      color: #0a1c2e;
      font-size: 0.95rem;
      margin-bottom: 0.2rem;
    }

    .schedule-cards .card-teacher {
      color: #1b3147;
      font-size: 0.8rem;
    }

    .schedule-cards .card-bottom {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.3rem;
    }

    .schedule-cards .card-auditorium {
      background: #eef3fa;
      padding: 0.05rem 0.5rem;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #1f364d;
      font-weight: 450;
    }

    .schedule-cards .card-territory {
      font-size: 0.7rem;
      color: #4a637e;
    }

    /* ============================================
       АДАПТИВНОСТЬ
    ============================================ */

    /* ПК — показываем таблицу */
    @media (min-width: 769px) {
      .schedule-table {
        display: flex;
      }
      .schedule-cards {
        display: none;
      }
      .card {
        padding: 1.5rem 1.8rem;
      }
      .head h1 {
        font-size: 1.9rem;
      }
      .head h1 span {
        font-size: 1.2rem;
      }
    }

    /* Телефон — показываем карточки */
    @media (max-width: 768px) {
      .schedule-table {
        display: none;
      }
      .schedule-cards {
        display: flex;
      }
      .card {
        padding: 0.8rem 0.8rem;
        border-radius: 20px;
      }
      .head h1 {
        font-size: 1.3rem;
      }
      .head h1 span {
        font-size: 0.9rem;
      }
      .day-btn {
        padding: 0.25rem 0.9rem;
        font-size: 0.75rem;
      }
      .day-label {
        font-size: 0.75rem;
      }
    }

    @media (max-width: 420px) {
      .card {
        padding: 0.5rem 0.5rem;
        border-radius: 16px;
      }
      .head h1 {
        font-size: 1.1rem;
      }
      .head h1 span {
        font-size: 0.8rem;
      }
      .day-btn {
        padding: 0.2rem 0.7rem;
        font-size: 0.65rem;
      }
      .day-label {
        font-size: 0.65rem;
      }
      .schedule-cards .card-item {
        padding: 0.5rem 0.6rem;
      }
      .schedule-cards .card-discipline {
        font-size: 0.85rem;
      }
      .schedule-cards .card-teacher {
        font-size: 0.7rem;
      }
      .schedule-cards .card-pair {
        font-size: 0.7rem;
        padding: 0.05rem 0.5rem;
      }
      .schedule-cards .card-time {
        font-size: 0.6rem;
      }
    }

    .empty-message {
      padding: 2rem 0.5rem;
      text-align: center;
      color: #97aec9;
      background: #fafdff;
      border-radius: 32px;
      border: 1px dashed #d7e0eb;
      font-size: 0.9rem;
    }

    .error {
      text-align: center;
      padding: 1.5rem;
      color: #b91c1c;
      background: #fef2f2;
      border-radius: 24px;
      border: 1px solid #fecaca;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
<div class="card">

  <div class="head">
    <h1>📖 расписание <span>И-24-1</span></h1>
  </div>

  <div class="day-nav" id="dayNav">
    <div style="display:flex; gap:0.3rem 0.5rem; flex-wrap:wrap;">
      <div class="skeleton-shimmer" style="width:60px; height:2rem; border-radius:60px;"></div>
      <div class="skeleton-shimmer" style="width:60px; height:2rem; border-radius:60px;"></div>
      <div class="skeleton-shimmer" style="width:60px; height:2rem; border-radius:60px;"></div>
    </div>
    <span class="day-label" id="currentDateLabel"></span>
  </div>

  <div id="scheduleContainer">
    <!-- скелетон -->
    <div class="skeleton" id="skeletonContainer">
      <div class="skeleton-row">
        <div class="skeleton-shimmer short"></div>
        <div class="skeleton-shimmer long"></div>
        <div class="skeleton-shimmer medium"></div>
      </div>
      <div class="skeleton-row">
        <div class="skeleton-shimmer short"></div>
        <div class="skeleton-shimmer long"></div>
        <div class="skeleton-shimmer medium"></div>
      </div>
      <div class="skeleton-row">
        <div class="skeleton-shimmer short"></div>
        <div class="skeleton-shimmer long"></div>
        <div class="skeleton-shimmer medium"></div>
      </div>
      <div class="skeleton-row">
        <div class="skeleton-shimmer short"></div>
        <div class="skeleton-shimmer long"></div>
        <div class="skeleton-shimmer medium"></div>
      </div>
      <div class="skeleton-row">
        <div class="skeleton-shimmer short"></div>
        <div class="skeleton-shimmer long"></div>
        <div class="skeleton-shimmer medium"></div>
      </div>
    </div>
  </div>

</div>

<script>
  (function() {
    let scheduleData = [];
    let currentDate = '';

    const dayNav = document.getElementById('dayNav');
    const scheduleContainer = document.getElementById('scheduleContainer');
    const currentDateLabel = document.getElementById('currentDateLabel');
    const skeletonContainer = document.getElementById('skeletonContainer');

    const pairTimes = {
      1: '08:00–09:00',
      2: '09:10–10:10',
      3: '10:30–11:30',
      4: '11:40–12:40',
      5: '12:50–13:50'
    };

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function getTodayStr() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function groupPairsByPair(pairs) {
      const map = new Map();
      pairs.forEach(item => {
        const key = item.pair;
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(item);
      });
      return map;
    }

    function getCurrentPairNumber() {
      const now = new Date();
      const totalMinutes = now.getHours() * 60 + now.getMinutes();
      const ranges = [
        { pair: 1, start: 8 * 60, end: 9 * 60 },
        { pair: 2, start: 9 * 60 + 10, end: 10 * 60 + 10 },
        { pair: 3, start: 10 * 60 + 30, end: 11 * 60 + 30 },
        { pair: 4, start: 11 * 60 + 40, end: 12 * 60 + 40 },
        { pair: 5, start: 12 * 60 + 50, end: 13 * 60 + 50 },
      ];
      for (const p of ranges) {
        if (totalMinutes >= p.start && totalMinutes < p.end) return p.pair;
      }
      return null;
    }

    function renderSchedule(dateStr) {
      skeletonContainer.style.display = 'none';

      if (!scheduleData.length) {
        scheduleContainer.innerHTML = `<div class="empty-message">📭 нет данных</div>`;
        return;
      }

      const dayData = scheduleData.find(item => item.date === dateStr);
      if (!dayData || !dayData.pairs || dayData.pairs.length === 0) {
        scheduleContainer.innerHTML = `<div class="empty-message">✕ на этот день пар нет</div>`;
        return;
      }

      const today = getTodayStr();
      const isToday = dateStr === today;
      let currentPair = isToday ? getCurrentPairNumber() : null;

      const grouped = groupPairsByPair(dayData.pairs);
      const sortedKeys = Array.from(grouped.keys()).sort((a, b) => a - b);

      // ——— ТАБЛИЦА ДЛЯ ПК ———
      let tableHtml = `<div class="schedule-table schedule-content">
        <div class="row-header">
          <span>Пара</span><span>Время</span><span>Подгр.</span>
          <span>Дисциплина</span><span>Преподаватель</span>
          <span>Аудитория</span><span>Территория</span>
        </div>`;

      // ——— КАРТОЧКИ ДЛЯ ТЕЛЕФОНА ———
      let cardsHtml = `<div class="schedule-cards schedule-content">`;

      sortedKeys.forEach(pairNum => {
        const items = grouped.get(pairNum);
        const isCurrent = (currentPair === pairNum);
        const rowClass = isCurrent ? 'row-item current-pair' : 'row-item';
        const cardClass = isCurrent ? 'card-item current-pair' : 'card-item';
        const time = pairTimes[pairNum] || '—';

        if (items.length > 1) {
          const subgroups = items.map(it => it.subgroup).filter(s => s !== '');
          const subgroupDisplay = subgroups.length > 0 ? subgroups.join(', ') : '—';
          const disciplines = [...new Set(items.map(it => it.discipline))];
          const teachers = [...new Set(items.map(it => it.teacher))];
          const auditoriums = [...new Set(items.map(it => it.auditorium))];
          const territories = [...new Set(items.map(it => it.territory))];

          // таблица
          tableHtml += `
            <div class="${rowClass}">
              <span class="pair-num">${pairNum}</span>
              <span class="pair-time">${time}</span>
              <span class="subgroup">${subgroupDisplay}</span>
              <span class="discipline">${disciplines.join(' / ')}</span>
              <span class="teacher">${teachers.join(' / ')}</span>
              <span class="auditorium">${auditoriums.join(' / ')}</span>
              <span class="territory">${territories.join(' / ')}</span>
            </div>`;

          // карточки
          cardsHtml += `
            <div class="${cardClass}">
              <div class="card-top">
                <span class="card-pair">${pairNum}</span>
                <span class="card-time">${time}</span>
                <span class="card-subgroup">${subgroupDisplay}</span>
              </div>
              <div class="card-discipline">${disciplines.join(' / ')}</div>
              <div class="card-teacher">${teachers.join(' / ')}</div>
              <div class="card-bottom">
                <span class="card-auditorium">${auditoriums.join(' / ')}</span>
                <span class="card-territory">${territories.join(' / ')}</span>
              </div>
            </div>`;

        } else {
          const item = items[0];
          const sub = item.subgroup || '';
          const subDisplay = sub || '—';

          tableHtml += `
            <div class="${rowClass}">
              <span class="pair-num">${item.pair}</span>
              <span class="pair-time">${time}</span>
              <span class="subgroup ${sub ? '' : 'empty'}">${subDisplay}</span>
              <span class="discipline">${item.discipline}</span>
              <span class="teacher">${item.teacher}</span>
              <span class="auditorium">${item.auditorium}</span>
              <span class="territory">${item.territory}</span>
            </div>`;

          cardsHtml += `
            <div class="${cardClass}">
              <div class="card-top">
                <span class="card-pair">${item.pair}</span>
                <span class="card-time">${time}</span>
                <span class="card-subgroup ${sub ? '' : 'empty'}">${subDisplay}</span>
              </div>
              <div class="card-discipline">${item.discipline}</div>
              <div class="card-teacher">${item.teacher}</div>
              <div class="card-bottom">
                <span class="card-auditorium">${item.auditorium}</span>
                <span class="card-territory">${item.territory}</span>
              </div>
            </div>`;
        }
      });

      tableHtml += `</div>`;
      cardsHtml += `</div>`;

      scheduleContainer.innerHTML = tableHtml + cardsHtml;
    }

    function renderDayButtons() {
      if (!scheduleData.length) return;
      const dates = scheduleData.map(item => item.date);

      dayNav.innerHTML = '';

      dates.forEach(dateStr => {
        const btn = document.createElement('button');
        const isActive = dateStr === currentDate;
        btn.className = 'day-btn' + (isActive ? ' active' : '');
        const d = new Date(dateStr + 'T00:00:00');
        btn.textContent = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        btn.dataset.date = dateStr;
        btn.addEventListener('click', () => {
          currentDate = dateStr;
          renderDayButtons();
          renderSchedule(currentDate);
        });
        dayNav.appendChild(btn);
      });

      const label = document.createElement('span');
      label.className = 'day-label';
      const found = scheduleData.find(item => item.date === currentDate);
      label.textContent = found ? formatDate(currentDate) : '';
      dayNav.appendChild(label);
    }

    function loadSchedule() {
      fetch('schedule.json')
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          return response.json();
        })
        .then(data => {
          if (!Array.isArray(data) || data.length === 0) {
            throw new Error('JSON должен содержать массив с расписанием');
          }
          scheduleData = data;
          const today = getTodayStr();
          currentDate = scheduleData.some(d => d.date === today) ? today : scheduleData[0]?.date || '';
          renderDayButtons();
          renderSchedule(currentDate);
        })
        .catch(error => {
          console.error('Ошибка:', error);
          skeletonContainer.style.display = 'none';
          scheduleContainer.innerHTML = `
            <div class="error">⚠️ не удалось загрузить schedule.json<br>
            <span style="font-size:0.8rem; color:#6b7280;">${error.message}</span></div>`;
        });
    }

    loadSchedule();
  })();
</script>
</body>
</html>
